# Checks the Supabase database throughout the day to reduce the chance of inactivity pausing.
# If Supabase reports the project is paused, an optional token lets the script request a restore.
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 5,13,21 * * *"
  workflow_dispatch:           # also lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/supabase-keepalive.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
